name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-c34e14b9-gctswk]
    paths-ignore: ['docs/**', '*.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Test & typecheck
        run: |
          npx tsc --noEmit
          TZ=Asia/Seoul npx jest

      - name: Generate native Android project (CNG)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/calendar-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: out/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "캘린더 APK #${GITHUB_RUN_NUMBER}" \
            --notes "폰에서 이 APK를 받아 설치하세요. (설정에서 '출처를 알 수 없는 앱 설치' 허용 필요) 커밋: ${GITHUB_SHA::7}"
